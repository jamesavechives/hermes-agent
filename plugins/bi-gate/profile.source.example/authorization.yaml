# ③ tools + action_max —— 技术负责人 + 合规双签，变更管控：最重
# CODEOWNERS: /profiles/*/authorization.yaml  @技术负责人 @合规
# 改这个文件等同权限变更，所以它单独成文件、单独设 owner。

_mock_fields:
  - action_max                # L1 这条线是技术侧设的，待业务方 + 合规确认
  - allowed_origins           # 只放行 human；cron 以谁的身份查还没定（§十一第 6）
  - principals                # 主体名单是 mock 的，真名单由业务方给
  - session_scan_max          # 3 亿行，取的是"看半年趋势算日常需求"那一档
  - action_policy.rules       # L0/L1/L2 怎么分，业务方 + 合规定

# 工具白名单。未声明 = 空白名单 = 拦一切，不是「不限制」。
#
# 注意这里**没有** memory：BI 人格现在写不了记忆。
# 这不是疏忽，是 Memory 选型的结论之一（见《Memory 选型 v1.0》§六）——
# 内置记忆的内容扫描拦得住注入模式，拦不住「以后所有查询默认用 UTC+0」
# 这种语义上的自我放宽。要不要开，归 §十一第 4 项一起拍。
tools:
  - query_metric

# 动作上限。未声明按 L0（最严）处理。
action_max: L1

# 会话累计扫描上限。3 亿行 ≈ 日活 250 天 / 现货成交量 35 天。
# 取这一档的依据是「看半年趋势算不算日常需求」——
#   算   → 3 亿以上，否则正常提问会被莫名其妙拒绝
#   不算 → 1 亿，助手定位成"看近期"
# 先按"算"走，免得开发阶段天天撞限额。待业务方定。
session_scan_max: 300000000

action_policy:
  version: mock-1
  default_level: L0
  rules:
    - level: L1
      label: 明细查询（按行返回，可能含个体数据）
      when: {param_equals: {granularity: row}}
    - level: L1
      label: 大结果集拉取（limit >= 10000）
      when: {param_gte: {limit: 10000}}
    - level: L1
      label: 高基数拆分（维度 >= 4 个）
      when: {dimensions_count_gte: 4}
    - level: L2
      label: 导出到受控环境之外
      when: {param_equals: {export: true}}
    - level: L2
      label: 指定了外部投递目标
      when: {param_present: [destination]}

# ── 身份透传（2026-08-28 加）────────────────────────────────────────────
#
# 接真实数据之前必须先有这一层。行列级权限只能由数据层保证，那么问题就是
# **这条查询以谁的身份到达数据层**。如果答案是「一个共享服务账号」，前面所有
# 门禁都白做 —— 门禁管「查什么」，管不了「以谁的名义查」。
#
# ⚠️ 这一层拿到的是**断言**，不是凭证。数据层必须自己独立验证（短期令牌 /
# 每人独立库账号 / 网关鉴权），否则信任边界还是停在 agent 进程上。
# 在数据层验证之前，这不是安全边界，是管道 + fail-closed 策略。

# 允许哪些来源发起查询。未声明 = 只允许 human。
#   human  —— 人在聊天里问
#   cron   —— 定时任务。**默认不放**：它以谁的身份查数据还没定（§十一第 6 条）
#   cli    —— 命令行。没有会话身份，接真实数据后一条都查不了；
#             要自查得走登记过的运维主体，不能靠环境变量塞
allowed_origins:
  - human

# 平台身份 → 数据层主体。这张表的真名单、谁维护、怎么同步，是业务方的事。
# 这里的是 mock，但**映射不到就拒绝** —— 不 mock 成"放行"。
principals:
  ou_mock_analyst_001:
    subject: bi_analyst_mock
    display: 示例分析师（mock）

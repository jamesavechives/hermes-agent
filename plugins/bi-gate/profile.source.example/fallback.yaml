# ⑤ fallback —— 业务方 + 合规，变更管控：中
# CODEOWNERS: /profiles/*/fallback.yaml  @业务方 @合规
#
# 四项的话术按 Tex 那份的方向写：让用户做选择题，而不是问答题。
# 但**转给谁、申请入口在哪**只有业务方知道，所以那两处留 null（待定）
# 而不是编一个 —— 编一个人名进去，助手会真的把用户导过去。

_mock_fields:
  - on_uncertain
  - on_timeout
  - refusal_script

# 不确定：给已查到的部分 + 给选项，不要开放式反问
on_uncertain: 我不确定这个口径。已经查到的是这些；要继续的话请选一个口径：A/B/C。核实请找【待定】。

# 超时/查不动：给具体的缩小方式，不是"请稍后重试"
on_timeout: 这次查询超时了。建议把时间范围缩小到 7 天以内，或者去掉一个拆分维度再试。

# 拒答：说明是权限限制、不是数据不存在，并指向申请入口
refusal_script: 这个查询超出了我被授权的范围，不是数据不存在。需要的话请走授权变更流程：【待定】。

# 升级：转人工给谁 —— 只有业务方知道，不编
escalation: null

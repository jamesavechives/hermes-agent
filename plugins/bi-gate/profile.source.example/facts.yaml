# ② facts —— 事实层责任人批准，变更管控：重
# CODEOWNERS: /profiles/*/facts.yaml  @事实层责任人
#
# 这里登记的就是「受控事实层」：没登记的指标一律拒绝。
# 这条是有意的 —— 助手答「这个指标没登记」，好过它自己拼一个口径然后被当成官方数字。

# ── 哪些值是我们先填的、还没人确认 ────────────────────────────
# mock 不能只写在注释里：注释不会被装配期检查读到，几周之后没人分得清
# 哪个值是拍过板的。列在这里，build_profile 和 assemble_check 都会报出来。
_mock_fields:
  - default_timezone
  - metrics[*].rows_per_day      # 底表日增行数，等数仓给真值
  - metrics[*].max_scan_rows     # 单次扫描上限，跟着 rows_per_day 一起定
  - metrics 清单本身              # 照 BI 常问的先列 15 个，等 Tex 的指标文档
  - forbidden_patterns           # 红线清单，等业务方 + 合规

# 统计时区。Tex 的《BI + AI 需求梳理》里明确让用户选 UTC8 还是 UTC0。
# 先按 UTC+8（运营日常口径通常按本地），待业务方确认。
default_timezone: UTC+8

# ── 红线：永远不该进这个助手的数据 ────────────────────────────
# 和"没登记"不是一回事：没登记只是暂时查不了，红线是明令禁止。
# 装配期检查会验没有指标命中这些模式 —— 防的是以后有人顺手把它们登记进来。
forbidden_patterns:
  - user_balance          # 单个用户的资金与持仓
  - user_position
  - kyc                   # 身份信息
  - id_card
  - passport
  - employee              # 员工数据
  - salary
  - unreleased            # 未公开的经营数字

metrics:
  # ── 用户 ──────────────────────────────────────────────
  - name: daily_active_users
    label: 日活用户数
    dimensions: [market, channel]
    requires_time_window: true
    rows_per_day: 1200000
    max_scan_rows: 150000000
    owner: null
    source: null

  - name: new_registrations
    label: 新注册用户数
    dimensions: [market, channel]
    requires_time_window: true
    rows_per_day: 80000
    max_scan_rows: 30000000
    owner: null
    source: null

  - name: active_traders
    label: 活跃交易用户数
    dimensions: [market, product]
    requires_time_window: true
    rows_per_day: 400000
    max_scan_rows: 100000000
    owner: null
    source: null

  # ── 交易 ──────────────────────────────────────────────
  - name: spot_trade_volume
    label: 现货成交量
    dimensions: [symbol, market]
    requires_time_window: true
    rows_per_day: 8600000
    max_scan_rows: 200000000
    owner: null
    source: null

  - name: contract_trade_volume
    label: 合约成交量
    dimensions: [symbol, market]
    requires_time_window: true
    rows_per_day: 12000000
    max_scan_rows: 250000000

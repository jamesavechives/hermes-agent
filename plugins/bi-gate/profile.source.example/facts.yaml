  - name: current_open_interest
    label: 当前未平仓量
    dimensions: [symbol]
    requires_time_window: false   # 快照类，不需要时间窗
    # 快照类也必须给 rows_per_day —— 设了会话预算之后，预估不出来的指标
    # 会被按「判定不了」拒，等于这个指标是死的（2026-08-27 实测撞到过）。
    rows_per_day: 240000
    owner: null
    source: null

  # ── 资金 ──────────────────────────────────────────────

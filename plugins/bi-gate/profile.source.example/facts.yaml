# ② facts —— 事实层责任人批准，变更管控：重
# CODEOWNERS: /profiles/*/facts.yaml  @事实层责任人
#
# 这里登记的就是「受控事实层」：没登记的指标一律拒绝。
# 这条是有意的 —— 助手答「这个指标没登记」，好过它自己拼一个口径然后被当成官方数字。

# 统计时区。Tex 的《BI + AI 需求梳理》里明确让用户选 UTC8 还是 UTC0，
# 我们原先漏了这一项。默认值待业务方定，见《待确认事项》第三节。
default_timezone: null

metrics:
  - name: daily_active_users
    label: 日活用户数
    dimensions: [market, channel]
    requires_time_window: true
    rows_per_day: 1200000
    max_scan_rows: 50000000
    owner: null        # 口径归谁 —— 待业务方给
    source: null       # 哪张清洗表 / 哪个看板 —— 待业务方给

  - name: spot_trade_volume
    label: 现货成交量
    dimensions: [symbol, market]
    requires_time_window: true
    rows_per_day: 8600000
    # 原先这里写的是 2 亿。那和 authorization.yaml 的 session_scan_max（1 亿）
    # 矛盾：2 亿 ≈ 23 天，但会话累计只有 1 亿 ≈ 11 天，第一次调用就会被会话预检
    # 拦下 —— 那条单次上限永远够不着，是个假的数字。
    # 2026-08-27 给装配期检查补了这条跨字段检测，它当场把这里点名了。
    # 现在压到会话预算之下；真值待业务方定（两个数要一起定）。
    max_scan_rows: 80000000
    owner: null
    source: null

  - name: current_open_interest
    label: 当前未平仓量
    dimensions: [symbol]
    requires_time_window: false   # 快照类，不需要时间窗
    # 快照类指标也必须给 rows_per_day —— 一次快照多少行。
    # 原先这里空着，结果：加了会话累计预算之后，这个指标的扫描量预估变成
    # 「判定不了」，会话预检按不通过处理，**它就再也查不了了，而且没人知道**。
    # 2026-08-27 补时区那轮实测撞出来的，随后给装配期检查补了这条检测。
    rows_per_day: 240000
    owner: null
    source: null
